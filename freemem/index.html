<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Free Memory</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "LG Smart UI", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  .pill {
    background: rgba(15, 23, 42, 0.92);
    border: 2px solid #14b8a6;
    border-radius: 28px;
    padding: 28px 52px;
    color: #f8fafc;
    font-size: 34px;
    font-weight: 600;
    letter-spacing: 0.4px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    display: flex;
    align-items: center;
  }
  .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #14b8a6;
    margin-right: 20px;
    animation: pulse 0.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(0.85); opacity: 0.6; }
    50% { transform: scale(1.2); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="pill">
    <div class="dot"></div>
    <span id="msg">Freeing Memory...</span>
  </div>
<script>
(function() {
  var running = false;

  function closeSelf() {
    try {
      if (window.PalmServiceBridge) {
        var b = new PalmServiceBridge();
        b.call("luna://com.webos.applicationManager/closeByAppId", JSON.stringify({ id: "com.github.dasilva333.freemem" }));
      }
    } catch (e) {}
    try { window.close(); } catch (e) {}
  }

  function runCleanup() {
    if (running) return;
    running = true;
    var msgEl = document.getElementById("msg");
    msgEl.textContent = "Freeing Memory...";

    var safety = setTimeout(closeSelf, 8000);

    try {
      var bridge = new PalmServiceBridge();
      bridge.onservicecallback = function(raw) {
        clearTimeout(safety);
        try {
          var res = JSON.parse(raw);
          var out = (res && res.stdoutString) ? JSON.parse(res.stdoutString.trim()) : null;
          if (out && out.ok) {
            msgEl.textContent = out.closed > 0
              ? "Closed " + out.closed + " app" + (out.closed === 1 ? "" : "s") + " (+" + out.freedMb + " MB)"
              : "Caches Flushed (+" + out.freedMb + " MB)";
          }
        } catch (e) {}
        setTimeout(closeSelf, 450);
      };
      var cmd = 'DIR="/media/developer/apps/usr/palm/applications/com.github.dasilva333.systemtools/bin/webos-memmgr.sh"; if [ -f "$DIR" ]; then sh "$DIR" clean-all; else /var/lib/webosbrew/bin/webos-memmgr.sh clean-all; fi';
      bridge.call(
        "luna://org.webosbrew.hbchannel.service/exec",
        JSON.stringify({ command: cmd })
      );
    } catch (err) {
      clearTimeout(safety);
      msgEl.textContent = "Error: " + err.message;
      setTimeout(closeSelf, 1500);
    }
  }

  document.addEventListener("webOSRelaunch", function() {
    running = false;
    runCleanup();
  });

  window.addEventListener("load", runCleanup);
})();
</script>
</body>
</html>
